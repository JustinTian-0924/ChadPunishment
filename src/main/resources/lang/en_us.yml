prefix: "<dark_gray>[<gradient:#ff5555:#ffaa00>ChadPunishment</gradient><dark_gray>] <reset> "

command:
  player-only: "&cOnly players can use this command."
  no-permission: "&cYou do not have permission to use this command."
  unknown-command: "&cUnknown sub-command."
  reload-success: "&aConfig and language files reloaded."

usage:
  main:
    - "&8&m-----------------------------"
    - "&cChadPunishment Help"
    - "&e/chadpunishment reload &7- Reload plugin"
    - "&e/chadpunishment status &7- View module status"
    - "&7Format: /<punishment> <player> <duration> [reason...]"
    - "&e/warn Steve 10m spam"
    - "&e/ban Steve permanent repeated griefing"
    - "&7Duration: 30s, 10m, 2h, 7d. /warn also accepts default."
    - "&8&m-----------------------------"

module:
  status-header: "&8&m---------- &cModule Status &8&m----------"
  status-line: "&e%module%&7: %status%"
  enabled: "&aEnabled"
  disabled: "&cDisabled"
  disabled-message: "&cThis module is currently disabled."

warn:
  usage: "&cUsage: /warn <player> <duration|default> [reason...]"
  check-usage: "&cUsage: /checkwarn <player>"
  module-disabled: "&cWarn module is currently disabled."
  no-permission: "&cYou do not have permission to use warn commands."
  player-not-found: "&cPlayer not found: &e%player%"
  invalid-duration: "&cInvalid duration: &e%duration%&c. Use 30s, 10m, 2h, 7d, or default."
  success: "&aWarned &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason% &7| &aActive warnings: &c%active_warns%"
  received: "&cWarning received &7| &cDuration: &e%duration% &7| &cReason: &f%reason%"
  check-header: "&8&m---------- &cActive warnings of %player% &8&m----------"
  check-empty: "&aThis player has no active warnings."
  check-line: "&e#%number% &7| Remaining: &c%remaining% &7| Issuer: &e%issuer% &7| Reason: &f%reason%"
  expired-cleaned: "&7Expired warnings cleaned."

time:
  permanent: "Permanent"
  seconds: "%seconds%s"
  minutes-seconds: "%minutes%m %seconds%s"
  hours-minutes: "%hours%h %minutes%m"
  days-hours: "%days%d %hours%h"

mute:
  usage: "&cUsage: /mute <player> <duration> [reason...]"
  perma-usage: "&cUsage: /permamute <player> [reason...] (permanent mute)"
  unmute-usage: "&cUsage: /unmute <player> [reason]"
  module-disabled: "&cMute module is currently disabled."
  no-permission: "&cYou do not have permission to use mute commands."
  player-not-found: "&cPlayer not found: &e%player%"
  invalid-duration: "&cInvalid duration: &e%duration%&c. Examples: 30s, 10m, 2h, 7d"
  success: "&aMuted &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  perma-success: "&aMuted &e%player% &7| &aDuration: &ePermanent &7| &aReason: &f%reason%"
  unmute-success: "&aUnmuted &e%player%&a. Reason: &f%reason%"
  not-muted: "&cPlayer &e%player% &cis not muted."
  received: "&cYou have been muted &7| &cDuration: &e%duration% &7| &cReason: &f%reason%"
  perma-received: "&cYou have been muted &7| &cDuration: &ePermanent &7| &cReason: &f%reason%"
  unmuted-received: "&aYou have been unmuted. Reason: &f%reason%"
  chat-blocked:
    - "&cYou are currently muted and cannot chat."
    - "&7Remaining: &e%remaining%"
    - "&7Reason: &f%reason%"
  command-blocked:
    - "&cYou are currently muted and cannot use this command."
    - "&7Blocked command: &f/%command%"
    - "&7Remaining: &e%remaining%"
    - "&7Mute reason: &f%reason%"

ban:
  invalid-ban-duration: "&cInvalid duration: &e%duration%&c. Use 30s, 10m, 1h, 7d, or permanent."
  tempban-usage: "&cUsage: /tempban <player> <duration> [reason...]"
  ban-usage: "&cUsage: /ban <player> <duration|permanent> [reason...]"
  unban-usage: "&cUsage: /unban <player> [reason]"
  module-disabled: "&cBan module is currently disabled."
  no-permission: "&cYou do not have permission to use ban commands."
  player-not-found: "&cPlayer not found: &e%player%"
  invalid-duration: "&cInvalid duration: &e%duration%&c. Examples: 30s, 10m, 2h, 7d"
  tempban-success: "&aBanned &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  ban-success: "&aBanned &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  unban-success: "&aUnbanned &e%player%&a. Reason: &f%reason%"
  not-banned: "&cPlayer &e%player% &cis not banned."
  kick-message:
    - "&cYou are banned from this server."
    - "&7Remaining: &e%remaining%"
    - "&7Reason: &f%reason%"
    - "&7Issuer: &e%issuer%"
  banip-usage: "&cUsage: /banip <player|ip> <duration|permanent> [reason...]"
  unbanip-usage: "&cUsage: /unbanip <player|ip> [reason]"
  ip-player-offline: "&cPlayer &e%player% &cis offline, so their IP cannot be found. You can enter the IP directly."
  invalid-ip: "&cInvalid IP or online player name: &e%input%"
  banip-success: "&aIP-banned &e%ip% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  tempbanip-success: "&aIP-banned &e%ip% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  unbanip-success: "&aUnbanned IP &e%ip%&a. Reason: &f%reason%"
  ip-not-banned: "&cIP &e%ip% &cis not banned."
  ip-kick-message:
    - "&cYour IP is banned from this server."
    - "&7IP: &e%ip%"
    - "&7Remaining: &e%remaining%"
    - "&7Reason: &f%reason%"
    - "&7Issuer: &e%issuer%"

voicechat:
  muted-blocked: "&cYou are muted and cannot use voice chat."
  hook-enabled: "&aSimple Voice Chat compatibility enabled."
  hook-disabled: "&7Simple Voice Chat not found. Voice compatibility disabled."

history:
  usage: "&cUsage: /punishhistory <player|uuid> [page]"
  no-permission: "&cYou do not have permission to view punishment history."
  player-not-found: "&cPlayer not found: &e%player%"
  empty: "&aPlayer &e%player% &ahas no punishment history."
  header: "&8&m---------- &cPunishment History of %player% &8&m----------"
  line: "&e#%number% &7| Type: &c%type% &7| Duration: &d%duration% &7| Reason: &f%reason% &7| Issuer: &e%issuer% &7| Time: &b%time%"
  line-extra: "&e#%number% &7| Type: &c%type% &7| Duration: &d%duration% &7| Reason: &f%reason% &7| Issuer: &e%issuer% &7| Time: &b%time% &7| Extra: &f%extra%"

help:
  header: "<dark_gray>──────── <gradient:#ff5555:#ffaa00>ChadPunishment Help</gradient> <dark_gray>────────"
  commands-tab: "<gray>[Commands]</gray>"
  commands-selected: "<green>[Commands]</green>"
  examples-tab: "<gray>[Examples]</gray>"
  examples-selected: "<green>[Examples]</green>"
  invalid-page: "<red>Use /chadpunishment help 1 or /chadpunishment help 2."
  commands:
    - "<gold>Record queries"
    - "<yellow>/chadpunishment query|browse <type> <name|uuid> [page]<gray> — History"
    - "<yellow>/chadpunishment check <type> <name|uuid> [page]<gray> — Active records"
    - "<gray>  Types: all / warn / mute / tempban"
    - "<yellow>/punishhistory <name|uuid> [page]<gray> — All history (existing shortcut)"
    - "<gold>Punishments"
    - "<yellow>/warn | /mute | /tempban <player> <duration> [reason...]"
    - "<yellow>/ban <player> <duration|permanent> [reason...]"
    - "<yellow>/banip <player|ip> <duration|permanent> [reason...]"
    - "<yellow>/permamute <player> [reason...]<gray> — Permanent mute"
    - "<yellow>/unmute | /unban | /unbanip <target> [reason...]<gray> — Revoke punishment"
    - "<yellow>/checkwarn <player><gray> — Active warnings"
    - "<gold>Plugin management"
    - "<yellow>/chadpunishment reload <gray>— Reload; <yellow>status <gray>— Module status"
    - "<gray>Duration: 30s, 10m, 2h, 7d; warn accepts default. Click [Examples] above."
  examples:
    - "<gray>Warn for 10 minutes:"
    - "<click:suggest_command:'/warn Steve 10m spam'><yellow>/warn Steve 10m spam</yellow></click>"
    - "<gray>Permanently ban a player:"
    - "<click:suggest_command:'/ban Steve permanent griefing'><yellow>/ban Steve permanent griefing</yellow></click>"
    - "<gray>Browse all recorded history:"
    - "<click:suggest_command:'/chadpunishment query all Steve'><yellow>/chadpunishment query all Steve</yellow></click>"
    - "<gray>Check active temporary or permanent mutes:"
    - "<click:suggest_command:'/chadpunishment check mute Steve'><yellow>/chadpunishment check mute Steve</yellow></click>"
    - "<gray>Query with a UUID instead of a name:"
    - "<yellow>/chadpunishment browse warn <uuid> [page]"
    - "<gray>Click a yellow example to fill the chat input. Replace Steve with the target player."
  footer: "<dark_gray>──────── <gray>Page %page%/2 · Click the tabs to switch</gray> <dark_gray>────────"
query:
  legacy-usage: "<red>Usage: /punishhistory <name|uuid> [page]"
  usage: "<red>Usage: /chadpunishment <query|browse|check> <all|warn|mute|tempban> <name|uuid> [page]"
  invalid-filter: "<red>Choose a type: all, warn, mute, or tempban."
  invalid-page: "<red>The page must be a positive whole number."
  page-out-of-range: "<red>This result has %pages% page(s)."
  invalid-target: "<red>Enter a Minecraft player name or a valid UUID (with or without hyphens)."
  ambiguous-player: "<red>More than one recorded UUID uses that name. Please query with a UUID."
  header: "<dark_gray>──── <gold>%player%</gold> <gray>· %view% <dark_gray>────"
  views:
    history: "History"
    active: "Active records"
  filters:
    all: "All"
    warn: "Warnings"
    mute: "Mutes"
    tempban: "Temporary bans"
  button: "<gray>[<aqua>%label%</aqua>]</gray>"
  button-selected: "<dark_gray>[<green>%label%</green>]</dark_gray>"
  history-line: "<gray>#%number% <yellow>%type% <dark_gray>| <aqua>%duration% <dark_gray>| <white>%reason%"
  active-line: "<gray>#%number% <yellow>%type% <dark_gray>| <green>%remaining% left <dark_gray>| <white>%reason%"
  module-disabled: " <red>[module disabled]</red>"
  empty-history: "<gray>No recorded history matches this filter."
  empty-active: "<green>No active player records match this filter."
  ip-not-checked: "<gray>IP restrictions were not checked: the player has no available current online IP."
  previous: "<aqua>[Previous]</aqua>"
  previous-disabled: "<dark_gray>[Previous]</dark_gray>"
  next: "<aqua>[Next]</aqua>"
  next-disabled: "<dark_gray>[Next]</dark_gray>"
  page: "<gray>Page <white>%page%/%pages%</white> · <white>%total%</white> records"
  hover-tip: "<dark_gray>Hover a record for its full reason, date and details."
  states:
    history: "Historical event; current status is not inferred"
    active: "Active"
    disabled: "Unexpired record; enforcement module is disabled"
  types:
    warn: "Warning"
    mute: "Mute"
    permamute: "Permanent mute"
    unmute: "Unmute"
    tempban: "Temporary ban"
    ban: "Permanent ban"
    unban: "Unban"
    banip: "IP ban"
    tempbanip: "Temporary IP ban"
    unbanip: "IP unban"
  details:
    - "<gold>%type% <gray>— %state%"
    - "<gray>UUID: <white>%uuid%"
    - "<gray>Record: <white>%id%"
    - "<gray>Issued: <white>%time%"
    - "<gray>Issuer: <white>%issuer%"
    - "<gray>Duration: <white>%duration%"
    - "<gray>Remaining: <white>%remaining%"
    - "<gray>Expires: <white>%expires%"
    - "<gray>Reason: <white>%reason%"
    - "<gray>Extra: <white>%extra%"
