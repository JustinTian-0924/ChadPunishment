  module-disabled: "&cBan module is currently disabled."
  no-permission: "&cYou do not have permission to use ban commands."
  player-not-found: "&cPlayer not found: &e%player%"
  invalid-duration: "&cInvalid duration: &e%duration%&c. Examples: 30s, 10m, 2h, 7d"
  tempban-success: "&aBanned &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  ban-success: "&aBanned &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  unban-success: "&aUnbanned &e%player%&a. Reason: &f%reason%"
  not-banned: "&cPlayer &e%player% &cis not banned."
  kick-message:
    - "&cYou are banned from this server."
    - "&7Remaining: &e%remaining%"
    - "&7Reason: &f%reason%"
    - "&7Issuer: &e%issuer%"
  banip-usage: "&cUsage: /banip <player|ip> <duration|permanent> [reason...]"
  unbanip-usage: "&cUsage: /unbanip <player|ip> [reason]"
