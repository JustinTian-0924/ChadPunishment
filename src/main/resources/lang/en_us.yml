prefix: "<dark_gray>[<gradient:#ff5555:#ffaa00>ChadPunishment</gradient><dark_gray>] <reset> "

command:
  player-only: "&cOnly players can use this command."
  no-permission: "&cYou do not have permission to use this command."
  unknown-command: "&cUnknown sub-command."
  reload-success: "&aConfig and language files reloaded."

usage:
  main:
    - "&8&m-----------------------------"
    - "&cChadPunishment Help"
    - "&e/chadpunishment reload &7- Reload plugin"
    - "&e/chadpunishment status &7- View module status"
    - "&7Format: /<punishment> <player> <duration> [reason...]"
    - "&e/warn Steve 10m spam"
    - "&e/ban Steve permanent repeated griefing"
    - "&7Duration: 30s, 10m, 2h, 7d. /warn also accepts default."
    - "&8&m-----------------------------"

module:
  status-header: "&8&m---------- &cModule Status &8&m----------"
  status-line: "&e%module%&7: %status%"
  enabled: "&aEnabled"
  disabled: "&cDisabled"
  disabled-message: "&cThis module is currently disabled."

warn:
  usage: "&cUsage: /warn <player> <duration|default> [reason...]"
  check-usage: "&cUsage: /checkwarn <player>"
  module-disabled: "&cWarn module is currently disabled."
  no-permission: "&cYou do not have permission to use warn commands."
  player-not-found: "&cPlayer not found: &e%player%"
  invalid-duration: "&cInvalid duration: &e%duration%&c. Use 30s, 10m, 2h, 7d, or default."
  success: "&aWarned &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason% &7| &aActive warnings: &c%active_warns%"
  received: "&cWarning received &7| &cDuration: &e%duration% &7| &cReason: &f%reason%"
  check-header: "&8&m---------- &cActive warnings of %player% &8&m----------"
  check-empty: "&aThis player has no active warnings."
  check-line: "&e#%number% &7| Remaining: &c%remaining% &7| Issuer: &e%issuer% &7| Reason: &f%reason%"
  expired-cleaned: "&7Expired warnings cleaned."

time:
  permanent: "Permanent"
  seconds: "%seconds%s"
  minutes-seconds: "%minutes%m %seconds%s"
  hours-minutes: "%hours%h %minutes%m"
  days-hours: "%days%d %hours%h"

mute:
  usage: "&cUsage: /mute <player> <duration> [reason...]"
  perma-usage: "&cUsage: /permamute <player> [reason...] (permanent mute)"
  unmute-usage: "&cUsage: /unmute <player> [reason]"
  module-disabled: "&cMute module is currently disabled."
  no-permission: "&cYou do not have permission to use mute commands."
  player-not-found: "&cPlayer not found: &e%player%"
  invalid-duration: "&cInvalid duration: &e%duration%&c. Examples: 30s, 10m, 2h, 7d"
  success: "&aMuted &e%player% &7| &aDuration: &e%duration% &7| &aReason: &f%reason%"
  perma-success: "&aMuted &e%player% &7| &aDuration: &ePermanent &7| &aReason: &f%reason%"
  unmute-success: "&aUnmuted &e%player%&a. Reason: &f%reason%"
  not-muted: "&cPlayer &e%player% &cis not muted."
  received: "&cYou have been muted &7| &cDuration: &e%duration% &7| &cReason: &f%reason%"
  perma-received: "&cYou have been muted &7| &cDuration: &ePermanent &7| &cReason: &f%reason%"
  unmuted-received: "&aYou have been unmuted. Reason: &f%reason%"
  chat-blocked:
    - "&cYou are currently muted and cannot chat."
    - "&7Remaining: &e%remaining%"
    - "&7Reason: &f%reason%"
  command-blocked:
    - "&cYou are currently muted and cannot use this command."
    - "&7Blocked command: &f/%command%"
    - "&7Remaining: &e%remaining%"
    - "&7Mute reason: &f%reason%"

