help:
  header: "<dark_gray>──────── <gradient:#ff5555:#ffaa00>ChadPunishment 帮助</gradient> <dark_gray>────────"
  commands-tab: "<gray>[指令说明]</gray>"
  commands-selected: "<green>[指令说明]</green>"
  examples-tab: "<gray>[使用示例]</gray>"
  examples-selected: "<green>[使用示例]</green>"
  invalid-page: "<red>请使用 /chadpunishment help 1 或 /chadpunishment help 2。"
  commands:
    - "<gold>记录查询"
    - "<yellow>/chadpunishment query|browse <类型> <玩家名|UUID> [页码]<gray> — 历史记录"
    - "<yellow>/chadpunishment check <类型> <玩家名|UUID> [页码]<gray> — 当前有效记录"
    - "<gray>  类型: all（全部）/ warn（警告）/ mute（禁言）/ tempban（临时封禁）"
    - "<yellow>/punishhistory <玩家名|UUID> [页码]<gray> — 所有历史（原有快捷指令）"
    - "<gold>处罚指令"
    - "<yellow>/warn | /mute | /tempban <玩家> <持续时间> [理由...]"
    - "<yellow>/ban <玩家> <持续时间|permanent> [理由...]"
    - "<yellow>/banip <玩家|IP> <持续时间|permanent> [理由...]"
    - "<yellow>/permamute <玩家> [理由...]<gray> — 永久禁言"
    - "<yellow>/unmute | /unban | /unbanip <对象> [理由...]<gray> — 解除对应处罚"
    - "<yellow>/checkwarn <玩家><gray> — 当前有效警告"
    - "<gold>插件管理"
    - "<yellow>/chadpunishment reload <gray>— 重载；<yellow>status <gray>— 模块状态"
    - "<gray>时间: 30s、10m、2h、7d；warn 可用 default。具体例子请点击上方 [使用示例]。"
  examples:
    - "<gray>发出一条有效期 10 分钟的警告："
    - "<click:suggest_command:'/warn Steve 10m 刷屏'><yellow>/warn Steve 10m 刷屏</yellow></click>"
    - "<gray>永久封禁玩家："
    - "<click:suggest_command:'/ban Steve permanent 多次破坏'><yellow>/ban Steve permanent 多次破坏</yellow></click>"
    - "<gray>查看玩家的全部历史记录："
    - "<click:suggest_command:'/chadpunishment query all Steve'><yellow>/chadpunishment query all Steve</yellow></click>"
    - "<gray>只查看当前有效的临时或永久禁言："
    - "<click:suggest_command:'/chadpunishment check mute Steve'><yellow>/chadpunishment check mute Steve</yellow></click>"
    - "<gray>使用 UUID 查询，不依赖当前玩家名称："
    - "<yellow>/chadpunishment browse warn <UUID> [页码]"
    - "<gray>点击黄色示例可填入聊天框，再把 Steve 换成目标玩家。"
  footer: "<dark_gray>──────── <gray>第 %page%/2 页 · 点击上方标签切换</gray> <dark_gray>────────"
